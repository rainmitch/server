apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: my-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/rainmitch/server.git'
    targetRevision: HEAD
    path: apps/hello-world
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: default # The namespace where your workload will run
  syncPolicy:
    automated:
      selfHeal: true
      prune: true