---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ai-stack
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/rainmitch/server.git'
    targetRevision: HEAD
    path: apps/ai-stack
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: ai-stack
  syncPolicy:
    automated:
      selfHeal: true
      prune: true