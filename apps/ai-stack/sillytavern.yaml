---
apiVersion: v1
kind: Namespace
metadata:
  name: ai-stack
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sillytavern
  namespace: ai-stack
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sillytavern
  template:
    metadata:
      labels:
        app: sillytavern
    spec:
      containers:
      - name: sillytavern
        image: ghcr.io/sillytavern/sillytavern:1.19.1
        ports:
        - containerPort: 8000
        volumeMounts:
        - name: sillytavern-storage
          mountPath: /home/node/app/data
          subPath: data
        - name: sillytavern-storage
          mountPath: /home/node/app/config
          subPath: config
      volumes:
      - name: sillytavern-storage
        persistentVolumeClaim:
          claimName: sillytavern-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: sillytavern-svc
  namespace: ai-stack
spec:
  type: ClusterIP
  selector:
    app: sillytavern
  ports:
  - port: 8000
    targetPort: 8000
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: longhorn-ai-stack-retain
provisioner: driver.longhorn.io
reclaimPolicy: Retain
volumeBindingMode: Immediate
allowVolumeExpansion: true
parameters:
  recurringJobSelector: "[]"
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: pvc-sillytavern-2026-01
spec:
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: longhorn-ai-stack-retain
  csi:
    driver: driver.longhorn.io
    volumeHandle: pvc-sillytavern-2026-01
    fsType: ext4
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sillytavern-pvc
  namespace: ai-stack
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn-ai-stack-retain
  volumeName: pvc-sillytavern-2026-01
  resources:
    requests:
      storage: 10Gi