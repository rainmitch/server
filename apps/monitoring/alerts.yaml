apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-rules
  namespace: monitoring
data:
  node-alerts.yaml: |
    groups:
      - name: metal.rules
        rules:
          - alert: NodeHighTemperatureWarning
            expr: max by(node) (node_hwmon_temp_celsius{sensor_name="cpu_temp"}) >= 80
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "Node {{ $labels.node }} is running hot"
              description: "CPU temperature is at {{ $value }}°C."
          - alert: NodeHighTemperatureCritical
            expr: max by(node) (node_hwmon_temp_celsius{sensor_name="cpu_temp"}) >= 90
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: "Node {{ $labels.node }} is burning hot!"
              description: "CPU temperature is at {{ $value }}°C."