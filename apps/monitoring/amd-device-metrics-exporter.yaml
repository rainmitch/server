---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: amd-device-metrics-exporter
  namespace: monitoring
  labels:
    app.kubernetes.io/name: amd-device-metrics-exporter
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: amd-device-metrics-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: amd-device-metrics-exporter
    spec:
      hostNetwork: true
      containers:
      - name: exporter
        image: rocm/device-metrics-exporter:v1.5.3
        imagePullPolicy: Always
        securityContext:
          privileged: true
        ports:
        - containerPort: 5000
          name: metrics
        resources:
          limits:
            cpu: 200m
            memory: 256Mi
          requests:
            cpu: 50m
            memory: 64Mi
        volumeMounts:
        - name: dev-dri
          mountPath: /dev/dri
        - name: dev-kfd
          mountPath: /dev/kfd
        - name: sys
          mountPath: /sys
          readOnly: true
      volumes:
      - name: dev-dri
        hostPath:
          path: /dev/dri
      - name: dev-kfd
        hostPath:
          path: /dev/kfd
      - name: sys
        hostPath:
          path: /sys
---
apiVersion: v1
kind: Service
metadata:
  name: amd-device-metrics-exporter
  namespace: monitoring
  labels:
    app.kubernetes.io/name: amd-device-metrics-exporter
spec:
  selector:
    app.kubernetes.io/name: amd-device-metrics-exporter
  ports:
  - name: metrics
    port: 5000
    targetPort: 5000