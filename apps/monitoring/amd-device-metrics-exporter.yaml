---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: amd-device-metrics-exporter
  namespace: monitoring
  labels:
    app.kubernetes.io/name: amd-device-metrics-exporter
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: amd-device-metrics-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: amd-device-metrics-exporter
    spec:
      serviceAccountName: amd-device-metrics-exporter
      hostNetwork: true
      containers:
      - name: exporter
        image: rocm/device-metrics-exporter:v1.5.3
        imagePullPolicy: Always
        securityContext:
          privileged: true
        ports:
        - containerPort: 5000
          name: metrics
        resources:
          limits:
            cpu: 200m
            memory: 256Mi
          requests:
            cpu: 50m
            memory: 64Mi
        volumeMounts:
        - name: dev-dri
          mountPath: /dev/dri
        - name: dev-kfd
          mountPath: /dev/kfd
        - name: sys
          mountPath: /sys
          readOnly: true
        - name: kubelet-pods
          hostPath:
            path: /var/lib/kubelet/pod-resources
          mountPath: /var/lib/kubelet/pod-resources
      volumes:
      - name: dev-dri
        hostPath:
          path: /dev/dri
      - name: dev-kfd
        hostPath:
          path: /dev/kfd
      - name: sys
        hostPath:
          path: /sys
---
apiVersion: v1
kind: Service
metadata:
  name: amd-device-metrics-exporter
  namespace: monitoring
  labels:
    app.kubernetes.io/name: amd-device-metrics-exporter
spec:
  selector:
    app.kubernetes.io/name: amd-device-metrics-exporter
  ports:
  - name: metrics
    port: 5000
    targetPort: 5000
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: amd-device-metrics-exporter
  namespace: monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: amd-device-metrics-exporter
rules:
- apiGroups: [""]
  resources: ["nodes"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["events"]
  verbs: ["create", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: amd-device-metrics-exporter
subjects:
- kind: ServiceAccount
  name: amd-device-metrics-exporter
  namespace: monitoring
roleRef:
  kind: ClusterRole
  name: amd-device-metrics-exporter
  apiGroup: rbac.authorization.k8s.io