apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root-application
  namespace: apps
spec:
  project: default
  source:
    repoURL: 'https://github.com/rainmitch/server.git'
    targetRevision: HEAD
    path: apps
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: apps
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true